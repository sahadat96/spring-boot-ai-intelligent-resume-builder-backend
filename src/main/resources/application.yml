server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_intelligent_backend}
    username: ${DATABASE_USER:sahadat}
    password: ${DATABASE_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
      
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform, identity, account, billing, document, resume
    default-schema: platform
    create-schemas: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC