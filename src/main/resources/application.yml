server:
  port: ${PORT}
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: opticareer
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS}
      
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform, identity, account, billing, document, resume, ai, tailoring, analysis
    default-schema: platform
    create-schemas: true
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT}
      repositories:
        enabled: false

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED}
    operationsSorter: alpha
    tagsSorter: alpha

app:
  public-url: ${PUBLIC_URL}
  cors-origins: ${CORS_ORIGINS}
  mail-from: ${MAIL_FROM}
  security:
    jwt-key: ${JWT_KEY}
    encryption-key: ${ENCRYPTION_KEY}
    encryption-key-id: ${ENCRYPTION_KEY_ID}
    previous-encryption-keys: ${PREVIOUS_ENCRYPTION_KEYS:}
    cookie-secure: ${COOKIE_SECURE}
    issuer: ${JWT_ISSUER}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    access-minutes: ${JWT_ACCESS_MINUTES}
    refresh-days: ${JWT_REFRESH_DAYS}
    breached-password-check: ${BREACHED_PASSWORD_CHECK}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    signed-url-minutes: ${STORAGE_SIGNED_URL_MINUTES}
    scan-host: ${SCAN_HOST}
    scan-port: ${SCAN_PORT}
    scan-required: ${MALWARE_SCAN_REQUIRED}
  ai:
    url: ${AI_URL}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL}
    timeout-seconds: ${AI_TIMEOUT_SECONDS}
    max-concurrent: ${AI_MAX_CONCURRENT}
    daily-token-limit: ${AI_DAILY_TOKEN_LIMIT}
    enabled: ${AI_ENABLED}
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    base-url: ${STRIPE_BASE_URL}
    pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:}
    pro-six-month: ${STRIPE_PRICE_PRO_SIX_MONTH:}
    plus-monthly: ${STRIPE_PRICE_PLUS_MONTHLY:}
    plus-six-month: ${STRIPE_PRICE_PLUS_SIX_MONTH:}
    enabled: ${STRIPE_ENABLED}
  worker:
    enabled: ${WORKER_ENABLED}
    poll-ms: ${WORKER_POLL_MS}
    max-attempts: ${WORKER_MAX_ATTEMPTS}
    lease-seconds: ${WORKER_LEASE_SECONDS}

logging:
  level:
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    software.amazon.awssdk.request: OFF
    org.apache.http.wire: OFF
